name: Build PS2 dashboard
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the standalone catalog parser
        run: make test

  ps2-elf:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2sdk-ports:latest
    steps:
      - name: Install native build tools
        run: apk add --no-cache build-base git cmake pkgconf
      - uses: actions/checkout@v4
      - name: Provide gsKit
        run: |
          if [ ! -f "$PS2DEV/gsKit/lib/libgskit.a" ]; then
            if [ ! -d "$PS2DEV/gsKit" ]; then
              git clone --depth 1 https://github.com/ps2dev/gsKit.git "$PS2DEV/gsKit"
            fi
            make -C "$PS2DEV/gsKit" install
          fi
      - name: Compile diagnostic, demo and full dashboard variants
        run: |
          make diagnostics
          make demo
          make MODE=480p
          make MODE=720p
          make MODE=720p-single
          make MODE=720p-magh
          make MODE=1080i-magh
          make MODE=720p-magh-32
          make MODE=1080i-magh-32
          make MODE=probe720p
          make MODE=720p-hires
          make MODE=720p-hires2
          make MODE=probe720p-hires2
      - name: Verify actual ELF output
        shell: sh
        run: |
          set -eu
          for mode in diag480i diag576i diag480p diag720p-magh diag720p-magh-ct16 diag1080i-magh diag720p-magh-32 diag1080i-magh-32 diag720p-scaled diag720p-single diag720p-double diag720p-double-pad diag720p-698 diag720p-704 diag720p-640 diag720p-480 diag720p-rgb32 diag720p-16s demo480p 480p 720p 720p-single 720p-magh 1080i-magh 720p-hires probe720p 720p-hires2 probe720p-hires2; do
            elf="dist/PS25-$mode.ELF"
            test -s "$elf"
            signature="$(od -An -tx1 -N4 "$elf" | tr -d ' \\n')"
            test "$signature" = "7f454c46"
            echo "Validated $elf (ELF magic: $signature)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: PS2-5-experimental-ELFs
          path: dist/*.ELF
          if-no-files-found: error
